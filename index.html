<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INKVERSE — Community Blogging &amp; Creator Rewards Platform</title>
    <meta name="description" content="A modern, community-driven editorial publishing platform. Write meaningful stories, share unique perspectives, engage with a vibrant creator network, and earn reputation points." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://blog.shreeharsha.online" />
    <meta property="og:title" content="INKVERSE — Your Ideas Deserve to Be Read" />
    <meta property="og:description" content="Write something meaningful. Share your perspective. Build your audience. Earn recognition." />
    <meta property="og:image" content="https://blog.shreeharsha.online/og-default.jpg" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://blog.shreeharsha.online" />
    <meta name="twitter:title" content="INKVERSE — Community Blogging &amp; Creator Rewards" />
    <meta name="twitter:description" content="Write something meaningful. Share your perspective. Build your audience. Earn recognition." />
    <meta name="twitter:image" content="https://blog.shreeharsha.online/og-default.jpg" />

    <!-- Google Fonts: Plus Jakarta Sans & Newsreader & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
      // Immediate theme initialization to prevent flash
      (function() {
        try {
          const stored = localStorage.getItem('inkverse-theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-primary/30 selection:text-amber-200 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
