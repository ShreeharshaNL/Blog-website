name = "inkverse-blog"
main = "worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "inkverse-db"
database_id = "6cc7f367-c7d6-4961-8b78-974ad5ccf32b"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "inkverse-media"

[[kv_namespaces]]
binding = "KV"
id = "9e6351353da1406ca8a08965d65fe340"

[vars]
ENVIRONMENT = "production"
SITE_URL = "https://blog.shreeharsha.online"
